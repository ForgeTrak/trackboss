  cdk-diff:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Specify Node version
      uses: actions/setup-node@v2
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Frontend build
      run: cd frontend && npm install && npm run build-$TRACKBOSS_ENVIRONMENT_NAME
    - name: CDK diff - front end
      run: cd devops/deploy/frontend && npm install && npx cdk diff
    - name: CDK diff - back end
      run: cd devops/deploy/backend && npm install && npx cdk diff $TRACKBOSS_ENVIRONMENT_NAME-backendhost-stack
